name: tair-ops
description: 云数据库Tair（兼容redis）智能运维技能，支持CPU诊断、时延洞察、大Key分析等Redis专属功能

parameters:
  instance_id:
    type: string
    description: Tair实例ID
    required: true
  node_id:
    type: string
    description: 节点ID（必填参数）
    required: true
  start_time:
    type: string
    description: 开始时间（ISO8601格式）
    required: false
  end_time:
    type: string
    description: 结束时间（ISO8601格式）
    required: false
  top_n:
    type: string
    description: 查询前N条记录
    required: false

operations:
  - name: redis_cpu_diagnose_history_time
    description: CPU实时诊断（Tair/Redis）
    parameters: [instance_id, start_time, end_time]
  
  - name: important_performance_metrics_summary
    description: 重要性能指标总结
    parameters: [instance_id, node_id, start_time, end_time]
  
  - name: redis_latency_log_summary
    description: 时延洞察解读（Tair/Redis）
    parameters: [instance_id, node_id, start_time, end_time]
  
  - name: tair_history_large_key_query_and_analysis
    description: Large Key查询分析
    parameters: [instance_id, node_id, start_time, end_time]
  
  - name: query_the_instances_that_need_to_be_optimized
    description: 待优化实例概览
    parameters: [start_time, end_time]
  
  - name: list_instances
    description: 实例信息查询
    parameters: []
  
  - name: instance_topology_query_tool
    description: 实例拓扑查询
    parameters: [instance_id]
  
  - name: get_instance_config
    description: 实例配置查询
    parameters: [instance_id]